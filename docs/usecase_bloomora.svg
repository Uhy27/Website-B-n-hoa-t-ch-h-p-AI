<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&amp;display=swap');
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; }
    .bg { fill: #fcfcfd; }
    .title { font-size: 16px; font-weight: 700; fill: #0f172a; letter-spacing: 0.2px; }
    .actor-name { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .uc-text { font-size: 14px; font-weight: 600; fill: #334155; }
    .conn-line { stroke: #e06d3b; stroke-width: 1.8; stroke-linecap: round; }
    .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18px; ry: 18px; }
    .uc-node { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.4; filter: url(#shadow); }
    .actor-stick { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <!-- Background -->
  <rect width="900" height="450" class="bg" />

  <!-- ================= 1. KHUNG HỆ THỐNG (SYSTEM BOUNDARY) ================= -->
  <rect x="200" y="35" width="500" height="380" class="boundary" />
  <text x="450" y="75" text-anchor="middle" class="title">Hệ thống Website Bán hoa Bloomora</text>

  <!-- ================= 2. ACTOR BÊN TRÁI: KHÁCH HÀNG ================= -->
  <g id="actor-khachhang">
    <!-- Đầu -->
    <circle cx="105" cy="190" r="15" class="actor-stick" />
    <!-- Thân -->
    <line x1="105" y1="205" x2="105" y2="250" class="actor-stick" />
    <!-- Tay -->
    <line x1="80" y1="220" x2="130" y2="220" class="actor-stick" />
    <!-- Chân trái -->
    <line x1="105" y1="250" x2="85" y2="290" class="actor-stick" />
    <!-- Chân phải -->
    <line x1="105" y1="250" x2="125" y2="290" class="actor-stick" />
    <!-- Tên Actor -->
    <text x="105" y="320" text-anchor="middle" class="actor-name">Khách hàng</text>
  </g>

  <!-- ================= 3. ACTOR BÊN PHẢI: QUẢN TRỊ VIÊN ================= -->
  <g id="actor-quantrivien">
    <!-- Đầu -->
    <circle cx="795" cy="190" r="15" class="actor-stick" />
    <!-- Thân -->
    <line x1="795" y1="205" x2="795" y2="250" class="actor-stick" />
    <!-- Tay -->
    <line x1="770" y1="220" x2="820" y2="220" class="actor-stick" />
    <!-- Chân trái -->
    <line x1="795" y1="250" x2="775" y2="290" class="actor-stick" />
    <!-- Chân phải -->
    <line x1="795" y1="250" x2="815" y2="290" class="actor-stick" />
    <!-- Tên Actor -->
    <text x="795" y="320" text-anchor="middle" class="actor-name">Quản trị viên</text>
  </g>

  <!-- ================= 4. ĐƯỜNG KẾT NỐI (MÀU CAM NHƯ MẪU) ================= -->
  <!-- Nối từ Khách hàng (130, 220) sang 3 Use case trái -->
  <line x1="130" y1="220" x2="245" y2="135" class="conn-line" />
  <line x1="130" y1="220" x2="240" y2="220" class="conn-line" />
  <line x1="130" y1="220" x2="245" y2="305" class="conn-line" />

  <!-- Nối từ Quản trị viên (770, 220) sang 3 Use case phải -->
  <line x1="770" y1="220" x2="655" y2="135" class="conn-line" />
  <line x1="770" y1="220" x2="660" y2="220" class="conn-line" />
  <line x1="770" y1="220" x2="655" y2="305" class="conn-line" />

  <!-- ================= 5. CÁC HÌNH ELIP USE CASE TRONG HỆ THỐNG ================= -->
  <!-- Cột Trái: Chức năng Khách hàng -->
  <g>
    <ellipse cx="335" cy="135" rx="90" ry="28" class="uc-node" />
    <text x="335" y="141" text-anchor="middle" class="uc-text">Tìm &amp; xem hoa</text>
  </g>

  <g>
    <ellipse cx="335" cy="220" rx="95" ry="28" class="uc-node" />
    <text x="335" y="226" text-anchor="middle" class="uc-text">Đặt hoa &amp; in thiệp</text>
  </g>

  <g>
    <ellipse cx="335" cy="305" rx="90" ry="28" class="uc-node" />
    <text x="335" y="311" text-anchor="middle" class="uc-text">Tra cứu đơn hàng</text>
  </g>

  <!-- Cột Phải: Chức năng Quản trị viên -->
  <g>
    <ellipse cx="565" cy="135" rx="90" ry="28" class="uc-node" />
    <text x="565" y="141" text-anchor="middle" class="uc-text">Quản lý hoa tươi</text>
  </g>

  <g>
    <ellipse cx="565" cy="220" rx="95" ry="28" class="uc-node" />
    <text x="565" y="226" text-anchor="middle" class="uc-text">Quản lý đơn hàng</text>
  </g>

  <g>
    <ellipse cx="565" cy="305" rx="90" ry="28" class="uc-node" />
    <text x="565" y="311" text-anchor="middle" class="uc-text">Xem báo cáo</text>
  </g>
</svg>
