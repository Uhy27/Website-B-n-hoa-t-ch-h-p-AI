<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&amp;display=swap');
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; }
    .bg { fill: #fcfcfd; }
    .title { font-size: 17px; font-weight: 700; fill: #0f172a; letter-spacing: 0.2px; }
    .actor-name { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .uc-text { font-size: 13px; font-weight: 600; fill: #334155; }
    .uc-sub { font-size: 10px; font-weight: 500; fill: #64748b; }
    .conn-line { stroke: #e06d3b; stroke-width: 1.8; stroke-linecap: round; }
    .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18px; ry: 18px; }
    .uc-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
    .actor-stick { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <!-- Background -->
  <rect width="1000" height="540" class="bg" />

  <!-- ================= 1. KHUNG HỆ THỐNG (SYSTEM BOUNDARY) ================= -->
  <rect x="210" y="30" width="580" height="480" class="boundary" />
  <text x="500" y="68" text-anchor="middle" class="title">Hệ thống Website Bán hoa Bloomora</text>

  <!-- ================= 2. ACTOR BÊN TRÁI: KHÁCH HÀNG ================= -->
  <g id="actor-khachhang">
    <!-- Đầu -->
    <circle cx="105" cy="245" r="16" class="actor-stick" />
    <!-- Thân -->
    <line x1="105" y1="261" x2="105" y2="310" class="actor-stick" />
    <!-- Tay -->
    <line x1="75" y1="278" x2="135" y2="278" class="actor-stick" />
    <!-- Chân trái -->
    <line x1="105" y1="310" x2="82" y2="355" class="actor-stick" />
    <!-- Chân phải -->
    <line x1="105" y1="310" x2="128" y2="355" class="actor-stick" />
    <!-- Tên Actor -->
    <text x="105" y="385" text-anchor="middle" class="actor-name">Khách hàng</text>
  </g>

  <!-- ================= 3. ACTOR BÊN PHẢI: QUẢN TRỊ VIÊN ================= -->
  <g id="actor-quantrivien">
    <!-- Đầu -->
    <circle cx="895" cy="245" r="16" class="actor-stick" />
    <!-- Thân -->
    <line x1="895" y1="261" x2="895" y2="310" class="actor-stick" />
    <!-- Tay -->
    <line x1="865" y1="278" x2="925" y2="278" class="actor-stick" />
    <!-- Chân trái -->
    <line x1="895" y1="310" x2="872" y2="355" class="actor-stick" />
    <!-- Chân phải -->
    <line x1="895" y1="310" x2="918" y2="355" class="actor-stick" />
    <!-- Tên Actor -->
    <text x="895" y="385" text-anchor="middle" class="actor-name">Quản trị viên</text>
  </g>

  <!-- ================= 4. ĐƯỜNG KẾT NỐI MÀU CAM (FAN-OUT LINES) ================= -->
  <!-- Nối từ Khách hàng (135, 278) sang 5 Use Case cột trái -->
  <line x1="135" y1="278" x2="250" y2="115" class="conn-line" />
  <line x1="135" y1="278" x2="250" y2="192" class="conn-line" />
  <line x1="135" y1="278" x2="250" y2="270" class="conn-line" />
  <line x1="135" y1="278" x2="250" y2="348" class="conn-line" />
  <line x1="135" y1="278" x2="250" y2="425" class="conn-line" />

  <!-- Nối từ Quản trị viên (865, 278) sang 5 Use Case cột phải -->
  <line x1="865" y1="278" x2="750" y2="115" class="conn-line" />
  <line x1="865" y1="278" x2="750" y2="192" class="conn-line" />
  <line x1="865" y1="278" x2="750" y2="270" class="conn-line" />
  <line x1="865" y1="278" x2="750" y2="348" class="conn-line" />
  <line x1="865" y1="278" x2="750" y2="425" class="conn-line" />

  <!-- ================= 5. CÁC HÌNH ELIP USE CASE (CHUẨN 2.4 USER STORIES) ================= -->

  <!-- Cột Trái: Chức năng Khách hàng -->
  <!-- 1. Đăng ký & Đăng nhập (US07, US08) -->
  <g>
    <ellipse cx="350" cy="115" rx="100" ry="26" class="uc-node" />
    <text x="350" y="120" text-anchor="middle" class="uc-text">Đăng ký &amp; Đăng nhập</text>
  </g>

  <!-- 2. Lọc hoa theo ngân sách (US01) -->
  <g>
    <ellipse cx="350" cy="192" rx="100" ry="26" class="uc-node" />
    <text x="350" y="197" text-anchor="middle" class="uc-text">Lọc hoa theo ngân sách</text>
  </g>

  <!-- 3. Mô phỏng thiệp & ruy băng (US02) -->
  <g>
    <ellipse cx="350" cy="270" rx="100" ry="26" class="uc-node" />
    <text x="350" y="275" text-anchor="middle" class="uc-text">Mô phỏng thiệp / ruy băng</text>
  </g>

  <!-- 4. Đặt hoa & Thanh toán VietQR (US03, US04, US05) -->
  <g>
    <ellipse cx="350" cy="348" rx="100" ry="26" class="uc-node" />
    <text x="350" y="353" text-anchor="middle" class="uc-text">Đặt hoa &amp; Quét VietQR</text>
  </g>

  <!-- 5. Tra cứu đơn & Xem ảnh hoa thật (US06, US12) -->
  <g>
    <ellipse cx="350" cy="425" rx="100" ry="26" class="uc-node" />
    <text x="350" y="430" text-anchor="middle" class="uc-text">Tra cứu &amp; Xem ảnh hoa thật</text>
  </g>

  <!-- Cột Phải: Chức năng Quản trị viên & Nhân viên -->
  <!-- 6. Đăng nhập Admin riêng biệt (US11) -->
  <g>
    <ellipse cx="650" cy="115" rx="100" ry="26" class="uc-node" />
    <text x="650" y="120" text-anchor="middle" class="uc-text">Đăng nhập Admin</text>
  </g>

  <!-- 7. Quản lý danh mục hoa (US10) -->
  <g>
    <ellipse cx="650" cy="192" rx="100" ry="26" class="uc-node" />
    <text x="650" y="197" text-anchor="middle" class="uc-text">Quản lý mẫu hoa tươi</text>
  </g>

  <!-- 8. Quản lý đơn hàng (US09, US10) -->
  <g>
    <ellipse cx="650" cy="270" rx="100" ry="26" class="uc-node" />
    <text x="650" y="275" text-anchor="middle" class="uc-text">Quản lý đơn hàng</text>
  </g>

  <!-- 9. Cập nhật tiến độ & Tải ảnh hoa (US09) -->
  <g>
    <ellipse cx="650" cy="348" rx="100" ry="26" class="uc-node" />
    <text x="650" y="353" text-anchor="middle" class="uc-text">Cập nhật đơn &amp; Tải ảnh hoa</text>
  </g>

  <!-- 10. Xem thống kê & Doanh thu (US10) -->
  <g>
    <ellipse cx="650" cy="425" rx="100" ry="26" class="uc-node" />
    <text x="650" y="430" text-anchor="middle" class="uc-text">Xem báo cáo doanh thu</text>
  </g>

</svg>
