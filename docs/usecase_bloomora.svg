<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1010" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <filter id="pill-shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; }
    .bg { fill: #131417; }
    
    /* Box boundaries */
    .box-outer { fill: #18191f; stroke: #2d2e36; stroke-width: 1.5; rx: 8px; ry: 8px; }
    .box-inner { fill: #1c1d24; stroke: #2a2b34; stroke-width: 1.2; rx: 6px; ry: 6px; }
    
    /* Headers */
    .header-khachhang { font-size: 13px; font-weight: 700; fill: #a78bfa; letter-spacing: 0.3px; }
    .header-vanhanh { font-size: 13px; font-weight: 700; fill: #60a5fa; letter-spacing: 0.3px; }
    .header-system { font-size: 14px; font-weight: 700; fill: #f472b6; letter-spacing: 0.5px; }
    .header-group { font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    
    /* Pills */
    .pill-customer { fill: #ffe4e6; stroke: #fb7185; stroke-width: 1.8; filter: url(#pill-shadow); }
    .pill-guest { fill: #ffffff; stroke: #818cf8; stroke-width: 1.8; filter: url(#pill-shadow); }
    .pill-admin { fill: #ede9fe; stroke: #a78bfa; stroke-width: 1.8; filter: url(#pill-shadow); }
    .pill-staff { fill: #fef3c7; stroke: #fbbf24; stroke-width: 1.8; filter: url(#pill-shadow); }
    
    .pill-uc { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; filter: url(#pill-shadow); }
    
    /* Badge Kế thừa */
    .badge-kethua-bg { fill: #1e1f26; stroke: #3f3f46; stroke-width: 1; rx: 4px; ry: 4px; }
    .badge-kethua-text { font-size: 11px; font-weight: 500; fill: #94a3b8; }
    
    /* Text inside pills */
    .text-customer { font-size: 13px; font-weight: 700; fill: #be123c; }
    .text-customer-sub { font-size: 12px; font-weight: 600; fill: #e11d48; }
    
    .text-guest { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .text-guest-sub { font-size: 12px; font-weight: 600; fill: #475569; }
    
    .text-admin { font-size: 13px; font-weight: 700; fill: #5b21b6; }
    .text-admin-sub { font-size: 12px; font-weight: 600; fill: #6d28d9; }
    
    .text-staff { font-size: 13px; font-weight: 700; fill: #92400e; }
    .text-staff-sub { font-size: 12px; font-weight: 600; fill: #b45309; }
    
    .text-uc { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    
    /* Connectors */
    .conn { stroke: #52525b; stroke-width: 1.4; fill: none; }
    .conn-accent { stroke: #e06d3b; stroke-width: 1.6; fill: none; }
  </style>

  <!-- Background -->
  <rect width="1020" height="1010" class="bg" />

  <!-- ================= 1. KHUNG: PHÍA KHÁCH HÀNG ================= -->
  <rect x="50" y="45" width="450" height="120" class="box-outer" />
  <text x="70" y="72" class="header-khachhang">👥 PHÍA KHÁCH HÀNG</text>
  
  <!-- Pill: Thành Viên (Customer) -->
  <g>
    <rect x="70" y="88" width="130" height="52" rx="26" class="pill-customer" />
    <text x="135" y="110" text-anchor="middle" class="text-customer">🌸 Thành Viên</text>
    <text x="135" y="128" text-anchor="middle" class="text-customer-sub">(Customer)</text>
  </g>

  <!-- Mũi tên Kế thừa -->
  <line x1="200" y1="114" x2="228" y2="114" class="conn" />
  <rect x="228" y="102" width="62" height="24" class="badge-kethua-bg" />
  <text x="259" y="118" text-anchor="middle" class="badge-kethua-text">Kế thừa</text>
  <line x1="290" y1="114" x2="318" y2="114" class="conn" marker-end="url(#arrow)" />

  <!-- Pill: Khách Vãng Lai (Guest) -->
  <g>
    <rect x="325" y="88" width="145" height="52" rx="26" class="pill-guest" />
    <text x="397" y="110" text-anchor="middle" class="text-guest">👤 Khách Vãng Lai</text>
    <text x="397" y="128" text-anchor="middle" class="text-guest-sub">(Guest)</text>
  </g>


  <!-- ================= 2. KHUNG: PHÍA VẬN HÀNH TIỆM ================= -->
  <rect x="525" y="165" width="445" height="120" class="box-outer" />
  <text x="545" y="192" class="header-vanhanh">👔 PHÍA VẬN HÀNH TIỆM</text>

  <!-- Pill: Quản Trị Viên (Admin) -->
  <g>
    <rect x="545" y="208" width="145" height="52" rx="26" class="pill-admin" />
    <text x="617" y="230" text-anchor="middle" class="text-admin">👑 Quản Trị Viên</text>
    <text x="617" y="248" text-anchor="middle" class="text-admin-sub">(Admin)</text>
  </g>

  <!-- Mũi tên Kế thừa -->
  <line x1="690" y1="234" x2="718" y2="234" class="conn" />
  <rect x="718" y="222" width="62" height="24" class="badge-kethua-bg" />
  <text x="749" y="238" text-anchor="middle" class="badge-kethua-text">Kế thừa</text>
  <line x1="780" y1="234" x2="808" y2="234" class="conn" marker-end="url(#arrow)" />

  <!-- Pill: Florist / Nhân Viên (Staff) -->
  <g>
    <rect x="815" y="208" width="145" height="52" rx="26" class="pill-staff" />
    <text x="887" y="230" text-anchor="middle" class="text-staff">✂️ Florist / NV</text>
    <text x="887" y="248" text-anchor="middle" class="text-staff-sub">(Staff)</text>
  </g>


  <!-- ================= 3. ĐƯỜNG KẾT NỐI TỪ CÁC ACTOR XUỐNG HỆ THỐNG ================= -->
  <!-- Nối từ Khách Vãng Lai sang phải và xuống -->
  <path d="M 470 114 L 720 114 L 720 330" class="conn" />
  <path d="M 470 114 L 910 114 L 910 160" class="conn" />
  
  <!-- Nối từ Florist sang phải -->
  <line x1="960" y1="234" x2="985" y2="234" class="conn" />
  <line x1="985" y1="234" x2="985" y2="330" class="conn" />

  <!-- Nút giao - box như trong hình -->
  <rect x="945" y="138" width="50" height="30" class="badge-kethua-bg" />
  <text x="970" y="157" text-anchor="middle" class="badge-kethua-text">-</text>


  <!-- ================= 4. KHUNG LỚN: HỆ THỐNG WEBSITE HOA TƯƠI BLOOMORA ================= -->
  <rect x="50" y="325" width="700" height="645" class="box-outer" />
  <text x="70" y="353" class="header-system">🌸 HỆ THỐNG WEBSITE HOA TƯƠI BLOOMORA</text>

  <!-- HÀNG 1: TÀI KHOẢN & BẢO MẬT + QUẢN TRỊ & VẬN HÀNH -->
  
  <!-- Nhóm 1: Tài Khoản & Bảo Mật -->
  <rect x="70" y="375" width="265" height="135" class="box-inner" />
  <text x="88" y="398" class="header-group">💼 Tài Khoản &amp; Bảo Mật</text>

  <rect x="85" y="415" width="235" height="36" rx="18" class="pill-uc" />
  <text x="202" y="438" text-anchor="middle" class="text-uc">[US07] Đăng ký tài khoản</text>

  <rect x="85" y="460" width="235" height="36" rx="18" class="pill-uc" />
  <text x="202" y="483" text-anchor="middle" class="text-uc">[US11] Cổng đăng nhập Admin</text>

  <!-- Nhóm 2: Quản Trị & Vận Hành -->
  <rect x="355" y="375" width="375" height="135" class="box-inner" />
  <text x="373" y="398" class="header-group">📊 Quản Trị &amp; Vận Hành</text>

  <rect x="370" y="415" width="345" height="36" rx="18" class="pill-uc" />
  <text x="542" y="438" text-anchor="middle" class="text-uc">[US10] Xem Dashboard doanh thu</text>

  <rect x="370" y="460" width="345" height="36" rx="18" class="pill-uc" />
  <text x="542" y="483" text-anchor="middle" class="text-uc">[US09] Cập nhật đơn &amp; tải ảnh hoa</text>


  <!-- HÀNG 2: KHÁM PHÁ & CHỌN HOA + TRA CỨU & DUYỆT HOA -->

  <!-- Nhóm 3: Khám Phá & Chọn Hoa -->
  <rect x="70" y="530" width="310" height="135" class="box-inner" />
  <text x="88" y="553" class="header-group">🌿 Khám Phá &amp; Chọn Hoa</text>

  <rect x="85" y="570" width="280" height="36" rx="18" class="pill-uc" />
  <text x="225" y="593" text-anchor="middle" class="text-uc">[US01] Lọc theo ngân sách &amp; màu</text>

  <rect x="85" y="615" width="280" height="36" rx="18" class="pill-uc" />
  <text x="225" y="638" text-anchor="middle" class="text-uc">[US02] Live Preview thiệp / ruy băng</text>

  <!-- Nhóm 4: Tra Cứu & Duyệt Hoa -->
  <rect x="400" y="530" width="330" height="135" class="box-inner" />
  <text x="418" y="553" class="header-group">📷 Tra Cứu &amp; Duyệt Hoa</text>

  <rect x="415" y="570" width="300" height="36" rx="18" class="pill-uc" />
  <text x="565" y="593" text-anchor="middle" class="text-uc">[US12] Tra cứu tiến độ đơn 5 bước</text>

  <rect x="415" y="615" width="300" height="36" rx="18" class="pill-uc" />
  <text x="565" y="638" text-anchor="middle" class="text-uc">[US06] Xem ảnh hoa thật cắm xong</text>


  <!-- HÀNG 3: MUA HÀNG & THANH TOÁN -->

  <!-- Nhóm 5: Mua Hàng & Thanh Toán -->
  <rect x="70" y="685" width="295" height="260" class="box-inner" />
  <text x="88" y="708" class="header-group">💐 Mua Hàng &amp; Thanh Toán</text>

  <rect x="85" y="725" width="265" height="36" rx="18" class="pill-uc" />
  <text x="217" y="748" text-anchor="middle" class="text-uc">[US03] Tùy chọn gửi tặng ẩn danh</text>

  <rect x="85" y="770" width="265" height="36" rx="18" class="pill-uc" />
  <text x="217" y="793" text-anchor="middle" class="text-uc">[US08] Tự động điền form mua hàng</text>

  <rect x="85" y="815" width="265" height="36" rx="18" class="pill-uc" />
  <text x="217" y="838" text-anchor="middle" class="text-uc">[US04] Chọn ngày &amp; giờ hẹn giao hoa</text>

  <rect x="85" y="860" width="265" height="36" rx="18" class="pill-uc" />
  <text x="217" y="883" text-anchor="middle" class="text-uc">[US05] Thanh toán quét VietQR tự động</text>

</svg>
